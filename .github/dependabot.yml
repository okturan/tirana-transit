version: 2
updates:
  - package-ecosystem: npm
    directory: /map-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-npm-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /gtfs-data
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-python-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
